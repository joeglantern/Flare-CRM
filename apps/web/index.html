<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Flare CRM: calls, WhatsApp, contacts and deals in one timeline."
    />
    <meta name="robots" content="noindex" />
    <!-- Link previews (WhatsApp, Slack, email clients). Crawlers need an absolute image URL;
         %VITE_APP_URL% is the site origin the build was given, empty for a local build. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flare CRM" />
    <meta property="og:title" content="Flare CRM" />
    <meta
      property="og:description"
      content="Calls, WhatsApp, contacts and deals in one timeline."
    />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Flare CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
