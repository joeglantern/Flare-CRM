    The icons this site uses, as one sprite referenced with <use>. Lucide geometry at 24x24, stroke
    1.75, so they match the ones inside the product. A sprite rather than a script: the page has to
    read correctly with JavaScript off, and the content security policy allows no third party.
  -->
