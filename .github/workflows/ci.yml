name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/api prisma:generate
      - run: pnpm --filter @crm/console-api prisma:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm --filter @crm/shared test
      - run: pnpm --filter @crm/api test:unit
      - run: pnpm --filter @crm/web openapi:types
      - run: pnpm --filter @crm/web test
      - run: pnpm --filter @crm/web build
      - run: pnpm --filter @crm/console-api test:unit
      - run: pnpm --filter @crm/console-web test
      - run: pnpm --filter @crm/console-web build
      - name: Integration tests (Testcontainers)
        run: pnpm --filter @crm/api test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'
      - name: Console integration tests (Testcontainers)
        run: pnpm --filter @crm/console-api test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build & scan ${{ matrix.image }}
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: crm-api
            dockerfile: apps/api/Dockerfile
          - image: crm-console-api
            dockerfile: apps/console-api/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The CRM image reports this to the owner console; the console image ignores it.
          build-args: |
            APP_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: ${{ matrix.image }}
